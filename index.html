<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de Multiplicar - Ronald Sánchez</title>
    <link rel="stylesheet" href="multiplicar.css">
    <script src="multiplicar.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="profile-container">
            <img src="FOTO_CON_ALESSIA.jpeg" alt="Logo Ronald y Alessia" class="logo">
            <h2 class="author-name">Ronald Sánchez V.</h2>
        </div>
        
        <div class="welcome-box">
            <h1>¡Aprendamos a Multiplicar! 🎨</h1>
            <p>Escribe un número abajo para generar su tabla automáticamente.</p>
        </div>

        <section class="input-section">
            <label for="txtValor">¿Qué tabla vamos a estudiar hoy?</label>
            <input type="number" id="txtValor" placeholder="Ejemplo: 5" class="tropical-input">
            <small id="help-msg">Presiona el botón o "Enter" para ver el resultado.</small>
        </section>
        
        <button onclick="generarTablas()" class="btn-probar">¡GENERAR TABLA!</button>
    </header>

    <main class="content">
        <div id="tablas" class="table-wrapper">
            <p class="empty-state">Ingresa un número para comenzar</p>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 - Creado por Ronald Sánchez V. para Rafaela</p>
    </footer>

</body>
</html>
