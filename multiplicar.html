<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3 - Ronald Sánchez</title>
    <link rel="stylesheet" href="multiplicar.css">
    <script src="multiplicar.js"></script>

</head>
<body>

    <header class="main-header">
        <div class="profile-container">
            <img src="FOTO_CON_ALESSIA.jpeg" alt="Logo Ronald y Alessia" class="logo">
            <h2 class="author-name">Ronald Sánchez</h2>
            
        </div>
        <section class="input-section">
        <label for="user-input">Ingresar multiplicacion:</label>
        <input type="number" id="txtValor" placeholder="Escribe algo aquí..." class="tropical-input">
        </section>
        <button onclick="generarTablas()" class="btn-probar">PROBAR</button>
    </header>

    <main class="content">
        <h1 class="tropical-title">Tablas de Multiplicar</h1>
        <div id="tablas" class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Operación</th>
                        <th>Resultado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>3 x 1</td><td>3</td></tr>
                    <tr><td>3 x 2</td><td>6</td></tr>
                    <tr><td>3 x 3</td><td>9</td></tr>
                    <tr><td>3 x 4</td><td>12</td></tr>
                    <tr><td>3 x 5</td><td>15</td></tr>
                    <tr><td>3 x 6</td><td>18</td></tr>
                    <tr><td>3 x 7</td><td>21</td></tr>
                    <tr><td>3 x 8</td><td>24</td></tr>
                    <tr><td>3 x 9</td><td>27</td></tr>
                    <tr><td>3 x 10</td><td>30</td></tr>
                </tbody>
            </table>
        </div>
    </main>

</body>

</html>
